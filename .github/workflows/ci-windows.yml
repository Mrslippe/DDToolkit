# Windows CI：Rust 壳单测 + 前端产物构建 + sidecar 全链路冒烟。
#
# 为什么 Rust 只在 Windows 跑：`src-tauri` 依赖 `windows-sys`，且被测逻辑本身
# （DWM 圆角判据、Job Object、托盘文案、`mklink /J` 的 junction 行为）都是 Windows 专属。
#
# ⚠️ **`cargo test` 在干净 clone 上会因"资源 glob 匹配不到"而失败**（2026-09-25 实测，devlog/199）：
#    `tauri.conf.json` 的 bundle 资源 glob 是 `binaries/backend/**/*`，而该目录由
#    PyInstaller 生成且被 gitignore ⇒ 干净 clone 上 glob 一个文件都匹配不到，
#    `tauri-build` 直接让 build.rs 失败：
#        glob pattern binaries/backend/**/* path not found or didn't match any files.
#    实测确认：放**任意一个占位文件**进去就能过（**不需要**真跑 PyInstaller、
#    **也不需要**前端 `dist/`）⇒ 所以下面第一步就是造占位文件。
#    `gen/` 不需要入库：build.rs 会自己重建（同一批实测）。

name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust 壳单测 + sidecar 冒烟
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 见文件头：没有这一步 cargo 连编译都过不去。**注意是文件不是目录** ——
      # glob `**/*` 要匹配到"东西"，空目录不算。
      - name: 为 cargo 造 sidecar 占位文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries/backend | Out-Null
          Set-Content -Path frontend/src-tauri/binaries/backend/ddtoolkit-backend.exe `
                      -Value 'ci placeholder' -Encoding ascii

      - name: Rust 单测（含 junction 危险路径矩阵）
        working-directory: frontend/src-tauri
        run: cargo test

      - name: 安装 uv（按 uv.lock 装环境，含 dev 与 build 组）
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 按 uv.lock 装环境
        run: uv sync --frozen

      - name: 后端单测（Windows 与 Linux 的差异只在文件系统与大小写，值得各跑一遍）
        run: uv run pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 按 package-lock.json 装依赖
        working-directory: frontend
        run: npm ci

      # 前端产物构建：`cargo test` 不需要它，但**打包需要**，而它坏了只有出包才发现。
      - name: 前端产物构建（tsc + vite build）
        working-directory: frontend
        run: npm run build

      # 冻结后端：这一步才真正需要 PyInstaller 与前端产物，也是"用户拿到的那个 exe"。
      # 它比 `cargo test` 慢得多（分钟级），所以排在最后 —— 前面任何一步红了就不用付这个钱。
      #
      # ⚠️ **必须给 UTF-8**（2026-09-25，devlog/200）：Windows runner 上 Python 的 stdout
      #    默认跟控制台代码页走（cp1252），而本仓脚本的提示语是中文
      #    ⇒ `UnicodeEncodeError: 'charmap' codec can't encode characters`，整步直接崩。
      #    与 Rust 壳拉起 sidecar 时注入 `PYTHONUTF8=1`/`PYTHONIOENCODING=utf-8` 同一个理由。
      - name: 冻结后端（PyInstaller onedir）
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: uv run python scripts/build_backend.py

      # ⚠️ 这一步要**自证失败原因**（2026-09-25）：第一版失败时只打印 `out.log`，
      #    而它是空的 ⇒ CI 只告诉我"60s 没就绪"，把真正的原因吞掉了。
      #    现在失败时打全现场：进程是否还活着、exit code、stdout/stderr、
      #    **数据目录里的 `logs/sidecar.log`**（那才是后端自己的启动日志）、以及 exe 实际大小。
      - name: 冻结后端冒烟（空数据目录 → /healthz）
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Continue"
          $d = Join-Path $env:RUNNER_TEMP "ddtoolkit-smoke"
          Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          $env:DDTOOLKIT_DATA_DIR = $d
          $env:DDTOOLKIT_PORT = "8231"
          $exe = "frontend\src-tauri\binaries\backend\ddtoolkit-backend.exe"
          Write-Host ("exe: {0}  ({1:N2} MB)" -f $exe, ((Get-Item $exe).Length / 1MB))

          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden `
                             -RedirectStandardOutput (Join-Path $d "out.log") `
                             -RedirectStandardError  (Join-Path $d "err.log")
          $ok = $false
          foreach ($i in 1..120) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) { Write-Host "进程已退出，exit code = $($p.ExitCode)"; break }
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8231/healthz" -TimeoutSec 3 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) {
            Write-Host "=== 现场 ==="
            Write-Host "HasExited = $($p.HasExited)"
            if ($p.HasExited) { Write-Host "ExitCode = $($p.ExitCode)" }
            foreach ($f in @("out.log", "err.log", "logs\sidecar.log", "logs\app.log")) {
              $path = Join-Path $d $f
              Write-Host "--- $f ---"
              if (Test-Path $path) { Get-Content $path -Encoding UTF8 | Select-Object -Last 30 }
              else { Write-Host "(不存在)" }
            }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "/healthz 未在 60s 内就绪（现场见上）" }
          Write-Host "冻结后端冒烟通过：$($r.Content)"

# ⚠️ **本文件不跑的**（在 CI 里跑不了，需要真桌面会话 / 真浏览器）：
#   · `scripts/ui_probe.py`（版式不变量探针）：要 Edge + Vite + 真实视口；
#   · 托盘隐藏/唤回/深休眠、数据目录迁移与"删旧目录"、更新器安装 —— 都是 OS 级交互。
#   这些的验证入口是 `docs/DEV-LOOP.md` §一/§四 与 `docs/TODO.md` §1.3 的真机清单。
#   把它们写成"CI 里永远跳过的一步"比不写更糟：会让人以为有覆盖。
