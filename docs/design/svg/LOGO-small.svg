<svg viewBox="0 0 180 140" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!--
    DDtoolkit 小尺寸专用稿（≤48px 用；≥64px 仍用主稿 LOGO.svg）
    用户 2026-09-09 定稿：方案 B「加粗版」——头部轮廓 + 大圆点眼 + 每侧 3 根胡须，
    线条从初稿的 18 收细到 16（用户：线条再稍微细一点）。
    结构 = 主稿去掉头部路径最前面那截「孤立胡须」+ 圆点眼 + 6 根短胡须。
    stroke-width 由 scripts/make_icons.py 原样使用（不按尺寸补偿）。
  -->
  <!-- 头部轮廓（耳朵含在路径里，取自 LOGO.svg 的头部子路径） -->
  <path d="M27.5624 65.2195C30.4767 41.2899 39.7395 18.3831 45.4435 7.85921C45.8205 7.16354 46.8135 7.18563 47.1754 7.88931L64.0003 40.6044C64.2008 40.9942 64.6316 41.207 65.0644 41.1381C73.4352 39.8053 89.4115 39.5072 95.556 40.1636C96.0153 40.2127 96.4578 39.9575 96.6285 39.5283L110.61 4.38598C110.896 3.66702 111.85 3.53506 112.302 4.16335C118.955 13.4181 131.202 36.1157 137.837 60.7599C139.315 66.2463 140.124 73.4457 139.964 79.812C139.779 87.232 137.277 95.8787 133.984 102.891C120.837 127.76 83.8374 127.26 79.8374 127.26C56.3605 126.39 41.8611 115.91 34.0703 102.891C30.8153 97.4514 28.7322 91.5705 27.6532 85.7599C25.9705 77.7599 27.5624 65.2195 27.5624 65.2195"
        stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <!-- 胡须：右 3 根 + 左 3 根（短、外扩，24px 下仍留得住） -->
  <path d="M138 60L168 49M140 80L170 79M136 100L165 110M28 62L0 53M28 86L0 86M32 102L6 116"
        stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <!-- 圆点眼：零长度线段 + round cap = 实心圆（直径 = stroke-width） -->
  <path d="M110 75.4L110 75.4M60.4 79.3L60.4 79.3"
        stroke="#fff" stroke-width="26" stroke-linecap="round"/>
</svg>
