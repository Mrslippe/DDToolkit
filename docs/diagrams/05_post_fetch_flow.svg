</defs><text x="120" y="42" font-size="18" fill="#1F3A5F" text-anchor="start" font-weight="700">帖子抓取链路 — scheduler.async_fetch_posts() / async_fetch_all_posts()</text><rect x="120" y="62" width="1000" height="52" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1.5"/><text x="620.0" y="82" font-size="13" fill="#9C4A0B" text-anchor="middle" font-weight="600">入口：POST /vtuber/fetch-posts（按名字模糊匹配 · video_pages / dynamics_pages，-1=全量）｜ POST /vtuber/fetch-all-posts</text><line x1="620" y1="114" x2="620" y2="142" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="320" y="142" width="600" height="52" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="620.0" y="162" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">_fetch_posts_core(mid, video_pages, dynamics_pages)</text><text x="332" y="185" font-size="12" fill="#334155" text-anchor="start" font-weight="400">_post_fetch_lock 防并发 · 独立 Session · PostFetchResult 汇总</text><line x1="620" y1="194" x2="620" y2="222" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="320" y="222" width="600" height="52" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="620.0" y="242" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">预读 existing_ids — 本账号已存 platform_post_id 集合</text><text x="332" y="265" font-size="12" fill="#334155" text-anchor="start" font-weight="400">内存去重 · 命中即 skipped，不发起详情请求</text><line x1="420" y1="274" x2="240" y2="300" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="1020" y1="274" x2="1020" y2="300" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="80" y="300" width="400" height="90" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="280.0" y="320" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">视频投稿分支</text><text x="92" y="343" font-size="12" fill="#334155" text-anchor="start" font-weight="400">fetch_bilibili_videos(mid, page)</text><text x="92" y="361" font-size="12" fill="#334155" text-anchor="start" font-weight="400">/x/space/wbi/arc/search · WBI 签名</text><text x="92" y="379" font-size="12" fill="#334155" text-anchor="start" font-weight="400">ps=30 · order=pubdate · 映射为 type=video</text><rect x="820" y="300" width="400" height="90" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="1020.0" y="320" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">动态分支</text><text x="832" y="343" font-size="12" fill="#334155" text-anchor="start" font-weight="400">fetch_bilibili_dynamics(mid, offset)</text><text x="832" y="361" font-size="12" fill="#334155" text-anchor="start" font-weight="400">/x/polymer/web-dynamic/v1/feed/space</text><text x="832" y="379" font-size="12" fill="#334155" text-anchor="start" font-weight="400">major.type: OPUS/DRAW/ARTICLE/ARCHIVE/LIVE/COMMON</text><path d="M80,480 V344" fill="none" stroke="#5B6B7C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrG2)"/><text x="96" y="412" font-size="11" fill="#2E9E5B" text-anchor="start" font-weight="400">page += 1 · 空页即止</text><path d="M1220,480 V344" fill="none" stroke="#5B6B7C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrG2)"/><text x="1036" y="412" font-size="11" fill="#2E9E5B" text-anchor="start" font-weight="400">offset = next_offset · has_more=false</text><line x1="280" y1="390" x2="280" y2="452" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="80" y="452" width="400" height="56" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="280.0" y="472" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">逐条映射 → Post 行（去重判断前置）</text><text x="92" y="495" font-size="12" fill="#334155" text-anchor="start" font-weight="400">bvid→permalink · play/comment→stats_json</text><line x1="1020" y1="390" x2="1020" y2="452" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="820" y="452" width="400" height="56" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="1020.0" y="472" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">逐条映射 → Post 行（六类动态 → type）</text><text x="832" y="495" font-size="12" fill="#334155" text-anchor="start" font-weight="400">文字/多图/专栏/视频/转发/直播</text><line x1="280" y1="508" x2="340" y2="560" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="1020" y1="508" x2="862" y2="560" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="320" y="560" width="560" height="56" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/><text x="600.0" y="580" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="600">platform_post_id ∈ existing_ids ？</text><text x="302" y="578" font-size="13" fill="#C0392B" text-anchor="start" font-weight="700">是</text><text x="612" y="634" font-size="13" fill="#2E9E5B" text-anchor="start" font-weight="700">否</text><rect x="80" y="560" width="200" height="56" rx="8" fill="#FDF0EF" stroke="#C0392B" stroke-width="1.5"/><text x="180.0" y="580" font-size="13" fill="#7B241C" text-anchor="middle" font-weight="600">skipped += 1</text><text x="92" y="603" font-size="12" fill="#334155" text-anchor="start" font-weight="400">已存在，跳过</text><line x1="318" y1="588" x2="282" y2="588" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="600" y1="616" x2="600" y2="648" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="280" y="648" width="680" height="150" rx="8" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5"/><text x="620.0" y="668" font-size="13" fill="#5B2C6F" text-anchor="middle" font-weight="600">类型化详情补全（feed → 完整数据）</text><text x="292" y="691" font-size="12" fill="#334155" text-anchor="start" font-weight="400">text / image → fetch_dynamic_detail() — OPUS 格式完整数据（正文/图片/统计）</text><text x="292" y="709" font-size="12" fill="#334155" text-anchor="start" font-weight="400">article → fetch_article_detail(cv_id) — 专栏全文 HTML + 阅读统计</text><text x="292" y="727" font-size="12" fill="#334155" text-anchor="start" font-weight="400">video（动态内视频）→ fetch_video_detail(bvid) — 完整简介 · 分P · 播放/弹幕统计</text><text x="292" y="745" font-size="12" fill="#334155" text-anchor="start" font-weight="400">每次详情调用后随机 sleep 0.5~2s · 详情失败 → warning + 回退 feed 数据</text><line x1="600" y1="798" x2="600" y2="826" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="280" y="826" width="680" height="72" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="620.0" y="846" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">_safe_store_post() — 落库</text><text x="292" y="869" font-size="12" fill="#334155" text-anchor="start" font-weight="400">PostRepo.create · IntegrityError（唯一约束兜底）→ rollback 跳过</text><text x="292" y="887" font-size="12" fill="#334155" text-anchor="start" font-weight="400">db.commit() · 汇总 stored / skipped · PostFetchResult{videos, dynamics, stored, skipped, rate_limited}</text><line x1="600" y1="898" x2="600" y2="926" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="320" y="926" width="560" height="52" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1.5"/><text x="600.0" y="946" font-size="13" fill="#9C4A0B" text-anchor="middle" font-weight="600">返回汇总 → /fetch-posts 汇总到 total ｜ /fetch-all-posts 逐个账号全量拉取</text><rect x="1240" y="300" width="100" height="110" rx="8" fill="#FFF" stroke="#D0C9B0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1252" y="324" font-size="11.5" fill="#7D6608" text-anchor="start" font-weight="700">节奏：</text><text x="1252" y="344" font-size="11" fill="#7D6608" text-anchor="start" font-weight="400">视频页后</text><text x="1252" y="362" font-size="11" fill="#7D6608" text-anchor="start" font-weight="400">sleep 1s</text><text x="1252" y="380" font-size="11" fill="#7D6608" text-anchor="start" font-weight="400">动态页后</text><text x="1252" y="398" font-size="11" fill="#7D6608" text-anchor="start" font-weight="400">sleep 20s</text><line x1="1220" y1="340" x2="1238" y2="340" stroke="#5B6B7C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrG)"/><rect x="1240" y="560" width="100" height="130" rx="8" fill="#FFF" stroke="#D0C9B0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1252" y="584" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="700">风控：</text><text x="1252" y="604" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400">任一列表</text><text x="1252" y="622" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400">调用触发</text><text x="1252" y="640" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400">→ 中断</text><text x="1252" y="658" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400">→ 上报</text><text x="1252" y="676" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400">→ 冷却</text><path d="M1220,480 H1240 V600" fill="none" stroke="#5B6B7C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrG)"/></svg>