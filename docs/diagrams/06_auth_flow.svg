</defs><text x="120" y="44" font-size="18" fill="#1F3A5F" text-anchor="start" font-weight="700">B 站登录态维护 — auth.BilibiliAuth.run_maintenance()（30 分钟循环）</text><rect x="320" y="70" width="560" height="52" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1.5"/><text x="600.0" y="90" font-size="13" fill="#9C4A0B" text-anchor="middle" font-weight="600">维护循环启动（lifespan 创建的后台 asyncio 任务）</text><line x1="600" y1="122" x2="600" y2="150" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="160" y="150" width="440" height="56" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="380.0" y="170" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">阶段 1 · check_session()</text><text x="172" y="193" font-size="12" fill="#334155" text-anchor="start" font-weight="400">GET /x/web-interface/nav → isLogin 校验</text><line x1="600" y1="206" x2="600" y2="234" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="260" y="234" width="240" height="52" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/><text x="380.0" y="254" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="600">会话有效？</text><text x="508" y="260" font-size="13" fill="#2E9E5B" text-anchor="start" font-weight="700">是</text><text x="600" y="260" font-size="13" fill="#C0392B" text-anchor="start" font-weight="700">否</text><rect x="680" y="176" width="440" height="52" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="900.0" y="196" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">顺手刷新 refresh_token</text><text x="692" y="219" font-size="12" fill="#334155" text-anchor="start" font-weight="400">GET /x/passport-login/web/cookie/info</text><line x1="500" y1="200" x2="678" y2="200" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="600" y1="286" x2="600" y2="314" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="160" y="314" width="440" height="56" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="380.0" y="334" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">阶段 2 · try_refresh()</text><text x="172" y="357" font-size="12" fill="#334155" text-anchor="start" font-weight="400">POST /x/passport-login/web/cookie/refresh（csrf + refresh_token）</text><line x1="600" y1="370" x2="600" y2="398" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="260" y="398" width="240" height="52" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/><text x="380.0" y="418" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="600">续期成功？</text><text x="508" y="424" font-size="13" fill="#2E9E5B" text-anchor="start" font-weight="700">是</text><text x="600" y="424" font-size="13" fill="#C0392B" text-anchor="start" font-weight="700">否</text><rect x="680" y="340" width="440" height="52" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="900.0" y="360" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">解析 Set-Cookie → 更新内存 + 写回 .env</text><text x="692" y="383" font-size="12" fill="#334155" text-anchor="start" font-weight="400">新 SESSDATA / bili_jct / refresh_token</text><line x1="500" y1="366" x2="678" y2="366" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="600" y1="450" x2="600" y2="478" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="160" y="478" width="440" height="72" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="380.0" y="498" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">阶段 3 · qr_login() — 扫码兜底</text><text x="172" y="521" font-size="12" fill="#334155" text-anchor="start" font-weight="400">生成二维码（终端 ASCII 打印）→ poll 每 2s 轮询</text><text x="172" y="539" font-size="12" fill="#334155" text-anchor="start" font-weight="400">最长 3 分钟 · 状态：等待/已扫/过期(86038)/成功(code=0)</text><line x1="600" y1="550" x2="600" y2="578" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="260" y="578" width="240" height="52" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/><text x="380.0" y="598" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="600">登录成功？</text><text x="508" y="604" font-size="13" fill="#2E9E5B" text-anchor="start" font-weight="700">是</text><text x="600" y="604" font-size="13" fill="#C0392B" text-anchor="start" font-weight="700">否</text><rect x="680" y="520" width="440" height="56" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="900.0" y="540" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">回调 data.url 种 Cookie → nav 验证</text><text x="692" y="563" font-size="12" fill="#334155" text-anchor="start" font-weight="400">提取 SESSDATA / bili_jct / uid → 写 .env</text><line x1="500" y1="548" x2="678" y2="548" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="680" y="596" width="440" height="52" rx="8" fill="#FDF0EF" stroke="#C0392B" stroke-width="1.5"/><text x="900.0" y="616" font-size="13" fill="#7B241C" text-anchor="middle" font-weight="600">全部失败</text><text x="692" y="639" font-size="12" fill="#334155" text-anchor="start" font-weight="400">30 分钟后重试</text><line x1="500" y1="622" x2="678" y2="622" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="400" y="690" width="400" height="52" rx="8" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5"/><text x="600.0" y="710" font-size="13" fill="#5B2C6F" text-anchor="middle" font-weight="600">await asyncio.sleep(1800)</text><text x="412" y="733" font-size="12" fill="#334155" text-anchor="start" font-weight="400">30 分钟后进入下一轮</text><path d="M900,228 H1130 V676 H700 V688" fill="none" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><path d="M900,392 H1130 V676 H700 V688" fill="none" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><path d="M900,576 H1130 V676 H700 V688" fill="none" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><path d="M900,648 H1130 V676 H700 V688" fill="none" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><path d="M600,742 V772 H620 V122" fill="none" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1010" y="700" width="140" height="100" rx="8" fill="#FFF" stroke="#D0C9B0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1024" y="724" font-size="11" fill="#8E44AD" text-anchor="start" font-weight="700">登录成功附带：</text><text x="1024" y="742" font-size="11" fill="#8E44AD" text-anchor="start" font-weight="400">清除 WBI 密钥</text><text x="1024" y="760" font-size="11" fill="#8E44AD" text-anchor="start" font-weight="400">缓存（登录态</text><text x="1024" y="778" font-size="11" fill="#8E44AD" text-anchor="start" font-weight="400">变化 → 强制</text><text x="1024" y="796" font-size="11" fill="#8E44AD" text-anchor="start" font-weight="400">换新密钥）</text><path d="M1120,548 H1160 V750 H1012" fill="none" stroke="#5B6B7C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrG)"/></svg>