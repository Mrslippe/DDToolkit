</defs><text x="60" y="44" font-size="18" fill="#1F3A5F" text-anchor="start" font-weight="700">FastAPI lifespan 生命周期（app/main.py）</text><rect x="180" y="70" width="560" height="52" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1.5"/><text x="460.0" y="90" font-size="13" fill="#9C4A0B" text-anchor="middle" font-weight="600">uvicorn 启动 · app.main:app</text><text x="194" y="104" font-size="11" fill="#5B6B7C" text-anchor="start" font-weight="400">模块加载：路由 / CORS / 静态目录注册</text><rect x="180" y="128" width="560" height="52" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1.5"/><text x="460.0" y="148" font-size="13" fill="#9C4A0B" text-anchor="middle" font-weight="600">logging.basicConfig — 双通道日志</text><text x="194" y="162" font-size="11" fill="#5B6B7C" text-anchor="start" font-weight="400">FileHandler(logs/app.log) + StreamHandler</text><rect x="180" y="186" width="560" height="52" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="460.0" y="206" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">Base.metadata.create_all(engine)</text><text x="194" y="220" font-size="11" fill="#5B6B7C" text-anchor="start" font-weight="400">按 ORM 模型自动建表（与 Alembic 双轨并存）</text><rect x="180" y="244" width="560" height="52" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="460.0" y="264" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">import_from_file() — CSV 导入</text><text x="194" y="278" font-size="11" fill="#5B6B7C" text-anchor="start" font-weight="400">读 vtubers.csv · flag=1 行 · 按 (platform,uid) 去重</text><rect x="180" y="302" width="560" height="52" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="460.0" y="322" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">start_scheduler() — 定时任务</text><text x="194" y="336" font-size="11" fill="#5B6B7C" text-anchor="start" font-weight="400">APScheduler BackgroundScheduler · 每 5 分钟 ±30s · max_instances=1</text><rect x="180" y="360" width="560" height="52" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="460.0" y="380" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">auth_task = create_task(run_maintenance())</text><text x="194" y="394" font-size="11" fill="#5B6B7C" text-anchor="start" font-weight="400">B 站登录态维护循环 · 每 30 分钟一次（后台 asyncio 任务）</text><rect x="180" y="418" width="560" height="52" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/><text x="460.0" y="438" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="600">新增 VTuber &gt; 0 ？</text><text x="194" y="452" font-size="11" fill="#5B6B7C" text-anchor="start" font-weight="400">新名单 → 5 秒后自动触发一次全量抓取</text><rect x="180" y="476" width="560" height="52" rx="8" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5"/><text x="460.0" y="496" font-size="13" fill="#5B2C6F" text-anchor="middle" font-weight="600">yield — 服务就绪</text><text x="194" y="510" font-size="11" fill="#5B6B7C" text-anchor="start" font-weight="400">Web 服务 + 定时抓取 + 认证循环三者并行</text><rect x="830" y="418" width="330" height="52" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/><text x="995.0" y="438" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="600">_delayed_fetch(5s)</text><text x="842" y="461" font-size="12" fill="#334155" text-anchor="start" font-weight="400">asyncio.sleep(5) → async_fetch_and_update()</text><text x="1000" y="496" font-size="12" fill="#7D6608" text-anchor="start" font-weight="700">yes</text><text x="530" y="496" font-size="12" fill="#7D6608" text-anchor="start" font-weight="700">no</text><rect x="180" y="534" width="560" height="52" rx="8" fill="#FDF0EF" stroke="#C0392B" stroke-width="1.5"/><text x="460.0" y="554" font-size="13" fill="#7B241C" text-anchor="middle" font-weight="600">收到关闭信号 → lifespan 恢复执行</text><rect x="180" y="592" width="560" height="52" rx="8" fill="#FDF0EF" stroke="#C0392B" stroke-width="1.5"/><text x="460.0" y="612" font-size="13" fill="#7B241C" text-anchor="middle" font-weight="600">auth_task.cancel() — 停止认证维护循环</text><rect x="180" y="650" width="560" height="52" rx="8" fill="#FDF0EF" stroke="#C0392B" stroke-width="1.5"/><text x="460.0" y="670" font-size="13" fill="#7B241C" text-anchor="middle" font-weight="600">shutdown_scheduler() — 安全关闭 APScheduler</text><text x="194" y="684" font-size="11" fill="#5B6B7C" text-anchor="start" font-weight="400">wait=False · 防止挂起任务阻塞退出</text><rect x="180" y="708" width="560" height="52" rx="8" fill="#FDF0EF" stroke="#C0392B" stroke-width="1.5"/><text x="460.0" y="728" font-size="13" fill="#7B241C" text-anchor="middle" font-weight="600">进程退出 · 数据库连接释放</text><line x1="460" y1="122" x2="460" y2="128" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="180" x2="460" y2="186" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="238" x2="460" y2="244" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="296" x2="460" y2="302" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="354" x2="460" y2="360" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="412" x2="460" y2="418" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="470" x2="460" y2="476" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="740" y1="444" x2="828" y2="444" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><path d="M830,444 V506 H460 V532" fill="none" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="528" x2="460" y2="534" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="586" x2="460" y2="592" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="644" x2="460" y2="650" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="460" y1="702" x2="460" y2="708" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="244" width="120" height="160" rx="8" fill="#FFF" stroke="#D0C9B0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="52" y="270" font-size="11" fill="#7D6608" text-anchor="start" font-weight="700">同步阻塞</text><text x="52" y="288" font-size="11" fill="#7D6608" text-anchor="start" font-weight="400">建表 + 导入</text><text x="52" y="306" font-size="11" fill="#7D6608" text-anchor="start" font-weight="400">在事件循环</text><text x="52" y="324" font-size="11" fill="#7D6608" text-anchor="start" font-weight="400">内同步执行</text><text x="52" y="342" font-size="11" fill="#7D6608" text-anchor="start" font-weight="400">（SQLite 本地</text><text x="52" y="360" font-size="11" fill="#7D6608" text-anchor="start" font-weight="400">开销小）</text><line x1="160" y1="300" x2="178" y2="300" stroke="#5B6B7C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrG)"/><rect x="830" y="560" width="330" height="96" rx="8" fill="#FFF" stroke="#D0C9B0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="848" y="582" font-size="11" fill="#5B2C6F" text-anchor="start" font-weight="700">常驻后台活动 × 3：</text><text x="848" y="600" font-size="11" fill="#5B2C6F" text-anchor="start" font-weight="400">① Web 请求处理（uvicorn）</text><text x="848" y="618" font-size="11" fill="#5B2C6F" text-anchor="start" font-weight="400">② APScheduler 抓取线程</text><text x="848" y="636" font-size="11" fill="#5B2C6F" text-anchor="start" font-weight="400">③ Auth 维护 asyncio 任务</text><line x1="830" y1="590" x2="742" y2="590" stroke="#5B6B7C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrG)"/></svg>