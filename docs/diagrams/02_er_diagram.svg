</defs><text x="60" y="52" font-size="18" fill="#1F3A5F" text-anchor="start" font-weight="700">SQLite 三表数据模型（SQLAlchemy ORM · 平台无关设计）</text><text x="60" y="76" font-size="12" fill="#5B6B7C" text-anchor="start" font-weight="400">posts 表刻意不带外键：以 (platform, platform_uid) 与 accounts 逻辑关联，联合投稿视频在每个 VTuber 下各存一份</text><rect x="60" y="110" width="330" height="220" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="225.0" y="134" font-size="13.5" fill="#1B4F8A" text-anchor="middle" font-weight="700">vtubers — 虚拟主播本体</text><text x="74" y="158" font-size="12" fill="#334155" text-anchor="start" font-weight="400">id · INTEGER 主键 索引</text><text x="74" y="178" font-size="12" fill="#334155" text-anchor="start" font-weight="400">name · 名字（索引）</text><text x="74" y="198" font-size="12" fill="#334155" text-anchor="start" font-weight="400">birthday · 生日 MM-DD</text><text x="74" y="218" font-size="12" fill="#334155" text-anchor="start" font-weight="400">debut_date · 出道日</text><text x="74" y="238" font-size="12" fill="#334155" text-anchor="start" font-weight="400">setting · 角色设定 TEXT</text><text x="74" y="258" font-size="12" fill="#334155" text-anchor="start" font-weight="400">avatar · 默认头像 URL</text><text x="74" y="278" font-size="12" fill="#334155" text-anchor="start" font-weight="400">notes · 备注</text><text x="74" y="298" font-size="12" fill="#334155" text-anchor="start" font-weight="400">created_at · UTC</text><text x="74" y="318" font-size="12" fill="#334155" text-anchor="start" font-weight="400">updated_at · 自动更新</text><rect x="560" y="96" width="360" height="368" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="740.0" y="120" font-size="13.5" fill="#1E6B3C" text-anchor="middle" font-weight="700">accounts — 各平台账号</text><text x="574" y="144" font-size="12" fill="#334155" text-anchor="start" font-weight="400">id · INTEGER 主键</text><text x="574" y="164" font-size="12" fill="#334155" text-anchor="start" font-weight="400">vtuber_id · FK→vtubers.id（级联删除）</text><text x="574" y="184" font-size="12" fill="#334155" text-anchor="start" font-weight="400">platform · 平台名（bilibili…）</text><text x="574" y="204" font-size="12" fill="#334155" text-anchor="start" font-weight="400">platform_uid · 平台侧 UID</text><text x="574" y="224" font-size="12" fill="#334155" text-anchor="start" font-weight="400">display_name · 平台昵称</text><text x="574" y="244" font-size="12" fill="#334155" text-anchor="start" font-weight="400">avatar_url · CDN 头像</text><text x="574" y="264" font-size="12" fill="#334155" text-anchor="start" font-weight="400">avatar_path · 本地缓存路径</text><text x="574" y="284" font-size="12" fill="#334155" text-anchor="start" font-weight="400">sign · 签名</text><text x="574" y="304" font-size="12" fill="#334155" text-anchor="start" font-weight="400">url · 主页链接</text><text x="574" y="324" font-size="12" fill="#334155" text-anchor="start" font-weight="400">followers_count · 粉丝数</text><text x="574" y="344" font-size="12" fill="#334155" text-anchor="start" font-weight="400">room_id · 直播间 ID</text><text x="574" y="364" font-size="12" fill="#334155" text-anchor="start" font-weight="400">live_status · 0 离线 / 1 直播</text><text x="574" y="384" font-size="12" fill="#334155" text-anchor="start" font-weight="400">live_title · 直播标题</text><text x="574" y="404" font-size="12" fill="#334155" text-anchor="start" font-weight="400">live_url · 直播链接</text><text x="574" y="424" font-size="12" fill="#334155" text-anchor="start" font-weight="400">last_fetched_at · 上次抓取</text><rect x="568" y="446" width="344" height="18" rx="8" fill="#FEF5E7" stroke="#F0B429" stroke-width="1"/><text x="740.0" y="458.5" font-size="11" fill="#9C5A0B" text-anchor="middle" font-weight="600">UNIQUE(platform, platform_uid)</text><rect x="1050" y="96" width="300" height="368" rx="8" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5"/><text x="1200.0" y="120" font-size="13.5" fill="#5B2C6F" text-anchor="middle" font-weight="700">posts — 动态 / 投稿</text><text x="1064" y="144" font-size="12" fill="#334155" text-anchor="start" font-weight="400">id · INTEGER 主键</text><text x="1064" y="164" font-size="12" fill="#334155" text-anchor="start" font-weight="400">platform · 平台（索引）</text><text x="1064" y="184" font-size="12" fill="#334155" text-anchor="start" font-weight="400">platform_uid · UID（索引）</text><text x="1064" y="204" font-size="12" fill="#334155" text-anchor="start" font-weight="400">platform_post_id · 帖子 ID</text><text x="1064" y="224" font-size="12" fill="#334155" text-anchor="start" font-weight="400">type · video/image/article/…</text><text x="1064" y="244" font-size="12" fill="#334155" text-anchor="start" font-weight="400">title · 标题</text><text x="1064" y="264" font-size="12" fill="#334155" text-anchor="start" font-weight="400">summary · 前 200 字</text><text x="1064" y="284" font-size="12" fill="#334155" text-anchor="start" font-weight="400">cover_url · 封面</text><text x="1064" y="304" font-size="12" fill="#334155" text-anchor="start" font-weight="400">permalink · 原始链接</text><text x="1064" y="324" font-size="12" fill="#334155" text-anchor="start" font-weight="400">body_json · 类型差异数据</text><text x="1064" y="344" font-size="12" fill="#334155" text-anchor="start" font-weight="400">stats_json · 播放/赞/评论</text><text x="1064" y="364" font-size="12" fill="#334155" text-anchor="start" font-weight="400">published_at · 发布时间</text><text x="1064" y="384" font-size="12" fill="#334155" text-anchor="start" font-weight="400">raw_json · 原始兜底</text><text x="1064" y="404" font-size="12" fill="#334155" text-anchor="start" font-weight="400">is_archived · 归档标记</text><text x="1064" y="424" font-size="12" fill="#334155" text-anchor="start" font-weight="400">created_at · UTC</text><rect x="1058" y="446" width="284" height="18" rx="8" fill="#FEF5E7" stroke="#F0B429" stroke-width="1"/><text x="1200.0" y="458.5" font-size="11" fill="#9C5A0B" text-anchor="middle" font-weight="600">UNIQUE(platform, uid, pid)</text><line x1="390" y1="250" x2="558" y2="250" stroke="#2F6FAD" stroke-width="2" marker-end="url(#arr)"/><text x="474" y="240" font-size="12" fill="#2F6FAD" text-anchor="middle" font-weight="600">1 : N  accounts</text><text x="474" y="272" font-size="11" fill="#5B6B7C" text-anchor="middle" font-weight="400">cascade="all, delete-orphan"</text><text x="378" y="265" font-size="13" fill="#2F6FAD" text-anchor="start" font-weight="700">1</text><text x="568" y="265" font-size="13" fill="#2F6FAD" text-anchor="start" font-weight="700">N</text><line x1="920" y1="270" x2="1048" y2="270" stroke="#8E44AD" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="984" y="260" font-size="12" fill="#8E44AD" text-anchor="middle" font-weight="600">逻辑关联（无 FK）</text><text x="984" y="292" font-size="11" fill="#5B6B7C" text-anchor="middle" font-weight="400">platform + platform_uid 匹配</text><rect x="60" y="502" width="1290" height="64" rx="8" fill="#FDFAF3" stroke="#D0C9B0" stroke-width="1.5"/><text x="80" y="526" font-size="12.5" fill="#7D6608" text-anchor="start" font-weight="700">去重策略：</text><text x="200" y="526" font-size="12" fill="#4A4A4A" text-anchor="start" font-weight="400">accounts 按 (platform, platform_uid) 唯一 —— 一个主播在同一平台只有一个账号；</text><text x="80" y="548" font-size="12" fill="#4A4A4A" text-anchor="start" font-weight="400">posts 按 (platform, platform_uid, platform_post_id) 唯一 —— 同一帖子在单个账号下只存一条；SQLite 改约束需重建表（迁移 c002）。</text></svg>