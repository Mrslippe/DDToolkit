</defs><text x="120" y="44" font-size="18" fill="#1F3A5F" text-anchor="start" font-weight="700">定时抓取流程 — scheduler.async_fetch_and_update()（风控自愈）</text><rect x="140" y="70" width="520" height="56" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1.5"/><text x="400.0" y="90" font-size="13" fill="#9C4A0B" text-anchor="middle" font-weight="600">APScheduler 触发 — 每 5 分钟 ±30s 抖动</text><text x="152" y="113" font-size="12" fill="#334155" text-anchor="start" font-weight="400">BackgroundScheduler · job id=fetch_vtubers · max_instances=1</text><line x1="400" y1="126" x2="400" y2="154" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="154" width="520" height="52" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="400.0" y="174" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">fetch_and_update_vtubers()</text><text x="152" y="197" font-size="12" fill="#334155" text-anchor="start" font-weight="400">同步包装函数 → asyncio.run() 桥接进事件循环</text><line x1="400" y1="206" x2="400" y2="234" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="200" y="234" width="400" height="52" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/><text x="400.0" y="254" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="600">尝试获取 _fetch_lock（非阻塞）？</text><text x="608" y="260" font-size="12" fill="#C0392B" text-anchor="start" font-weight="700">失败</text><text x="400" y="262" font-size="12" fill="#2E9E5B" text-anchor="start" font-weight="700">成功</text><rect x="60" y="234" width="130" height="64" rx="8" fill="#FDF0EF" stroke="#C0392B" stroke-width="1.5"/><text x="125.0" y="254" font-size="13" fill="#7B241C" text-anchor="middle" font-weight="600">本次触发结束</text><text x="72" y="277" font-size="12" fill="#334155" text-anchor="start" font-weight="400">防重叠：</text><text x="72" y="295" font-size="12" fill="#334155" text-anchor="start" font-weight="400">返回 skipped</text><line x1="200" y1="266" x2="192" y2="266" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="400" y1="286" x2="400" y2="314" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="314" width="520" height="52" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="400.0" y="334" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">读取全部 Account（platform_uid 非空）</text><text x="152" y="357" font-size="12" fill="#334155" text-anchor="start" font-weight="400">SessionLocal() 独立会话 · 供循环遍历</text><rect x="100" y="390" width="620" height="480" rx="8" fill="#FBFDFB" stroke="#7FB3D5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="114" y="412" font-size="12" fill="#2E86C1" text-anchor="start" font-weight="700">for 循环 · 每个 Account（idx / batch_count 计数）</text><line x1="400" y1="366" x2="400" y2="388" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="402" width="520" height="52" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="400.0" y="422" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">① fetch_bilibili_user_info(mid)</text><text x="152" y="445" font-size="12" fill="#334155" text-anchor="start" font-weight="400">WBI 签名 · tenacity 重试≤3 · 昵称/签名/头像/直播状态</text><line x1="400" y1="454" x2="400" y2="482" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="482" width="520" height="52" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="400.0" y="502" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">② 头像 URL 变化？→ _download_avatar()</text><text x="152" y="525" font-size="12" fill="#334155" text-anchor="start" font-weight="400">异步下载到 static/avatars/{uid}.jpg · 失败仅 warning</text><line x1="400" y1="534" x2="400" y2="562" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="200" y="562" width="400" height="52" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/><text x="400.0" y="582" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="600">③ was_rate_limited() ？</text><text x="608" y="588" font-size="12" fill="#C0392B" text-anchor="start" font-weight="700">触发</text><text x="400" y="588" font-size="12" fill="#2E9E5B" text-anchor="start" font-weight="700">正常</text><line x1="400" y1="614" x2="400" y2="642" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="642" width="520" height="52" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="400.0" y="662" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">④ fetch_bilibili_user_stat(mid)</text><text x="152" y="685" font-size="12" fill="#334155" text-anchor="start" font-weight="400">粉丝数/关注数 · 同样带重试与风控检测</text><line x1="400" y1="694" x2="400" y2="722" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="200" y="722" width="400" height="52" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/><text x="400.0" y="742" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="600">⑤ was_rate_limited() ？</text><text x="608" y="748" font-size="12" fill="#C0392B" text-anchor="start" font-weight="700">触发</text><text x="400" y="748" font-size="12" fill="#2E9E5B" text-anchor="start" font-weight="700">正常</text><line x1="400" y1="774" x2="400" y2="802" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="802" width="520" height="52" rx="8" fill="#EAF7EF" stroke="#27AE60" stroke-width="1.5"/><text x="400.0" y="822" font-size="13" fill="#1E6B3C" text-anchor="middle" font-weight="600">⑥ 随机等待 3~5s → db.commit() → 计数</text><text x="152" y="845" font-size="12" fill="#334155" text-anchor="start" font-weight="400">batch_count ≥ 10 → 额外休息 60s</text><rect x="760" y="570" width="300" height="190" rx="8" fill="#FDF0EF" stroke="#C0392B" stroke-width="1.5"/><text x="910.0" y="590" font-size="13" fill="#7B241C" text-anchor="middle" font-weight="600">风控分支（自愈）</text><text x="772" y="613" font-size="12" fill="#334155" text-anchor="start" font-weight="400">HTTP 412 / code -509,-412,-799 / 含"频繁"</text><text x="772" y="631" font-size="12" fill="#334155" text-anchor="start" font-weight="400">① commit 已更新数据 · close()</text><text x="772" y="649" font-size="12" fill="#334155" text-anchor="start" font-weight="400">② clear_rate_limit()</text><text x="772" y="667" font-size="12" fill="#334155" text-anchor="start" font-weight="400">③ await sleep(600s) 冷却</text><text x="772" y="685" font-size="12" fill="#334155" text-anchor="start" font-weight="400">④ 重建 Session · 重读 accounts</text><text x="772" y="703" font-size="12" fill="#334155" text-anchor="start" font-weight="400">⑤ continue — 从原 idx 继续</text><line x1="600" y1="588" x2="758" y2="630" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><line x1="600" y1="748" x2="758" y2="700" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><path d="M910,760 V856 H480 V868" fill="none" stroke="#5B6B7C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)"/><text x="640" y="848" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400">冷却结束 → 回到循环（idx 不变）</text><line x1="400" y1="870" x2="400" y2="908" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="140" y="908" width="520" height="62" rx="8" fill="#EAF2FB" stroke="#2E86C1" stroke-width="1.5"/><text x="400.0" y="928" font-size="13" fill="#1B4F8A" text-anchor="middle" font-weight="600">遍历完成 — 汇总返回</text><text x="152" y="951" font-size="12" fill="#334155" text-anchor="start" font-weight="400">FetchResult{success, failed, skipped, details} · 释放锁 · is_fetch_running=False</text><line x1="400" y1="970" x2="400" y2="998" stroke="#5B6B7C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="200" y="998" width="400" height="52" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1.5"/><text x="400.0" y="1018" font-size="13" fill="#9C4A0B" text-anchor="middle" font-weight="600">定时任务结束 / 手动触发响应返回</text></svg>