[pytest]
testpaths = tests
norecursedirs = frontend .git .pytest_cache __pycache__ node_modules
# 把仓库根显式加进 sys.path（2026-09-25，devlog/199 的 CI 首跑抓到）。
#
# ⚠️ 为什么必须有它：`tests/conftest.py` 在**导入期**就 `from app.services import scheduler`，
# 而两种调用方式的 `sys.path` 不一样：
#   · `python -m pytest` —— 把 CWD 加进 sys.path ⇒ 能导入（**开发机上一直用的是这一种**）；
#   · `pytest`（直接跑可执行文件，CI 里 `uv run pytest` 就是这种）—— **不加** ⇒
#     `ModuleNotFoundError: No module named 'app'`，pytest 连 conftest 都加载不了、直接退出。
# 症状极具误导性：本地全绿、CI 两个 Python 版本 + Windows 三处一起红，
# 看起来像平台或版本问题，其实**与平台和版本都无关**。
#
# 显式声明比"记得用 `-m`"可靠：它让**任何**调用方式都成立，也让这件事不再依赖隐含约定。
pythonpath = .
