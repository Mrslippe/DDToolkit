[package]
name = "ddtoolkit"
version = "1.1.0"
description = "DDtoolkit 桌面端 - VTuber 帖子查看"
authors = ["DDtoolkit"]
edition = "2021"

[lib]
name = "ddtoolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`：R18 的托盘能力（关闭 = 隐藏到托盘、托盘菜单退出）。见 devlog/095。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
# 文件夹选择框（R22-B2d 数据目录迁移）：用户口径是"系统文件夹选择框"
tauri-plugin-dialog = "2"
# 应用内更新（R23，devlog/113）：官方 updater（签名校验 + latest.json）+ 装完重启
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 一次性票据的随机源（`delete_old_data_dir` 的 migration_id，devlog/198）。
# 只用到 `getrandom::fill` —— 不需要 `rand` 那一整套。
getrandom = "0.3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  # ⚠️ **别删这一条**（2026-10-03 清理时试过）：`lib.rs::shell_open` 用的 `SW_SHOWNORMAL` 就在这个
  # namespace 里。它此前一直没写在这儿也能编过，是因为 `window-vibrancy`（tauri 的传递依赖）
  # 把同一个 crate 的这两个 feature 打开了、Cargo 做 feature 统一 —— **靠别人兜底**。
  # 哪天 window-vibrancy 不再开它，这里会突然编译失败（`CreateRoundRectRgn`/`SetWindowRgn` 那套
  # 小窗代码删掉之后，我们已经没有别的用途需要 `Win32_Graphics_Gdi`，那个就不用加回来）。
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
