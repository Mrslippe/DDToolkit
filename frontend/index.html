<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffa2b4'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='800' text-anchor='middle' fill='%23fc7079' font-family='sans-serif'%3ED%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDtoolkit</title>
    <style>
      /* 首绘即主色：消除「白底窗口→透明轮廓」两个中间态。
         揭幕时由 main.tsx 将 html 背景切回透明，恢复 L3 圆角透出桌面 */
      html {
        background: #ffa2b4;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 静态启动幕：纯 HTML 内联样式，HTML 解析即绘制（不等待 JS/CSS bundle），
         消除启动白闪。React 挂载后由像素级一致的 Splash 组件接管并移除此节点 -->
    <div
      id="boot-splash"
      style="position:fixed;inset:0;z-index:150;background:#ffa2b4;border-radius:var(--radius-window,4px);overflow:hidden;display:flex;align-items:center;justify-content:center"
    >
      <style>
        @keyframes boot-pulse {
          0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.35) }
          50% { transform: scale(1.06); box-shadow: 0 0 0 18px rgba(255, 255, 255, 0) }
        }
      </style>
      <div
        style="width:88px;height:88px;border-radius:22px;background:#fff;color:#fc7079;font-size:52px;font-weight:800;display:flex;align-items:center;justify-content:center;user-select:none;animation:boot-pulse 1.8s ease-in-out infinite"
      >
        D
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
